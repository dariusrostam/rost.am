  pdf: "/papers/cybersecurity-unternehmensleitungsaufgabe.pdf"
  thumbnail: "/papers/thumbs/cybersecurity-unternehmensleitungsaufgabe.jpg"
  abstract: >-
    Cybersecurity ist in einer digitalen Wirtschaft eine zentrale Herausforderung nahezu jedes Unternehmens. Die
    steigende Anzahl an Cyberattacken zeigt ein massiv zunehmendes Bedrohungspotential. Unternehmen stehen dabei
    vor unterschiedlichen Herausforderungen: Zum einen müssen sie ihre Handlungs- und Wettbewerbsfähigkeit vor
    Industriespionage, Hacking und Schadsoftware schützen. Zum anderen tragen sie, insbesondere in kritischen
    Infrastrukturen oder im Umgang mit personenbezogenen Daten, Pflichten gegenüber Dritten und dem Staat. Diese
    Verantwortung liegt letztlich bei den Geschäftsleitern, die wirtschaftliche Aspekte abwägen,
    Allgemeininteressen berücksichtigen und sich durch eine Vielzahl gesetzlicher Regelungen navigieren müssen –
    eine hochkomplexe Aufgabe, die mit erheblichen Schadens- und Haftungsrisiken verbunden ist. Der vorliegende
    Tagungsband dokumentiert die virtuelle Tagung „Cybersecurity als Unternehmensleitungsaufgabe", die in
    Kooperation mit der Friedrich-Naumann-Stiftung für die Freiheit am 23. und 24. Oktober 2020 an der Bucerius
    Law School in Hamburg stattfand. Die Tagung beleuchtete aus interdisziplinärer Perspektive die Probleme und
    Risiken, denen Unternehmen und ihre Geschäftsleiter im Umgang mit Cyberattacken ausgesetzt sind. Der Band
    enthält Beiträge von Gerald Spindler, Sarah Schmidt-Versteyl, Alexander Brüggemeier und Dennis-Kenji Kipker
    sowie ausgewählte Einsendungen von Katrin Haußmann, Isabella Risini und Andreas Beyer.

- slug: urheberrechtliche-aspekte-rl-2019-770
  title: "Urheberrechtliche Aspekte der Richtlinie 2019/770"
  authors: ["Darius Rostam", "Linda Kuschel"]
  year: 2020
  type: article
  areas: [copyright]
  venue: "CR 2020, 393"
  language: de
  openAccess: false
  doi: "10.9785/cr-2020-360613"
  pdf: "/papers/urheberrechtliche-aspekte-rl-2019-770.pdf"
  thumbnail: "/papers/thumbs/urheberrechtliche-aspekte-rl-2019-770.jpg"
  abstract: >-
    Die Richtlinie über bestimmte vertragsrechtliche Aspekte der Bereitstellung digitaler Inhalte und digitaler
    Dienstleistungen (DID-RL) soll laut Art. 3 Abs. 9 und Erwägungsgrund 36 das Urheberrecht unberührt lassen. Ihr
    Anwendungsbereich erstreckt sich jedoch auf Gegenstände, die nahezu immer urheber- oder
    leistungsschutzrechtlich geschützt sind. Obwohl sie primär das Vertragsverhältnis zwischen Diensteanbieter
    (Unternehmer) und Nutzer (Verbraucher) regelt, wird aus urheberrechtlicher Perspektive ein weiterer Akteur
    relevant: der (Urheber-)Rechtsinhaber. Die Konkretisierung von Rechten und Pflichten zwischen Diensteanbieter
    und Verbraucher durch die Richtlinie führt zu Regelungen, die urheberrechtliche Aspekte tangieren und damit
    mittelbar die Vertragsfreiheit der Rechteinhaber beeinflussen können. Der Beitrag untersucht die
    Schnittstellen zwischen der DID-RL und dem Urheberrecht und analysiert die potenziellen Auswirkungen der
    Richtlinie im Vergleich zum aktuellen Stand. Dabei werden insbesondere End User License Agreements, die
    Weiterveräußerung digitaler Werkexemplare, das Overblocking rechtmäßig hochgeladener Inhalte sowie die
    Nutzung urheberrechtlich geschützter Inhalte nach Vertragsbeendigung thematisiert.

- slug: adblocker
  title: "Die rechtliche Zulässigkeit von Adblockern"
  authors: ["Darius Rostam"]
  year: 2017
  type: article
  areas: [copyright, unfair-competition-law]
  venue: "InTeR 2017, 146"
  language: de
  openAccess: true
  url: "https://online.ruw.de/dfv-xaver/ruw/start.xav#/text/InTeR_2017_03%2FInTeR_2017_03_b12?_ts=1789888731831"
  pdf: "/papers/adblocker.pdf"
  thumbnail: "/papers/thumbs/adblocker.jpg"
  abstract: >-
    Im Kampf um die Aufmerksamkeit für Internetwerbung greifen immer mehr Internetnutzer zu Werbeblockern,
    englisch Adblocker. Der digitale Schutzschild wird damit zum Problem von Webseitenbetreibern, die existentiell
    auf Werbeerlöse angewiesen sind und von Werbenetzwerken, deren Reichweite auf dem Spiel steht. Doch gibt es
    einen Ausweg: Wer es auf die sog. Whitelist der Anbieter schafft, darf seine Werbung am Adblocker vorbei an
    die Nutzer ausspielen. Der Aufsatz untersucht die Zulässigkeit dieser Geschäftsmodelle, die inzwischen auch
    die instanzgerichtliche Rechtsprechung beschäftigt hat.
