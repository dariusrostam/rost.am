  thumbnail: "/papers/thumbs/vervielfaeltigungen-datensatz-zum.jpg"
  abstract: >-
    Anders als vielfach dargestellt betraf die vielbeachtete Entscheidung des LG Hamburg in Sachen Kneschke ./.
    LAION nicht das Training generativer KI als solches, sondern die Vervielfältigung eines Lichtbilds zum Abgleich
    mit einer aus dem Common-Crawl-Datensatz übernommenen Bildbeschreibung. Das Gericht wies die Klage über § 60d
    UrhG (TDM zu wissenschaftlichen Zwecken) ab, obwohl es die Anwendbarkeit der Schranke auf KI-Training insgesamt
    offenließ und sich dieser Frage dennoch in umfangreichen obiter dicta widmete. Der Beitrag kritisiert, dass das
    Gericht LAION zu Unrecht schon wegen der späteren Nutzung des Datensatzes durch Dritte als Forschungsorganisation
    einordnet, und zeigt für den maschinenlesbaren Nutzungsvorbehalt nach § 44b Abs. 3 UrhG auf, dass das Gericht
    allein auf die technischen Möglichkeiten der Nutzer abstellt und zumutbare Erklärungsmittel der Rechtsinhaber
    unberücksichtigt lässt.

- slug: urheberrecht-grenze-it-sicherheitsforschung
  title: "Das Urheberrecht als Grenze der IT-Sicherheitsforschung"
  authors: ["Darius Rostam"]
  year: 2023
  type: chapter
  areas: [copyright, it-security-law]
  venue: "in: Golla/Brodowski (Hrsg.), IT-Sicherheitsforschung und IT-Strafrecht, Mohr Siebeck, Tübingen 2023"
  language: de
  openAccess: true
  doi: "10.1628/978-3-16-162184-0"
  pdf: "/papers/urheberrecht-grenze-it-sicherheitsforschung.pdf"
  thumbnail: "/papers/thumbs/urheberrecht-grenze-it-sicherheitsforschung.png"
  abstract: >-
    Computerprogramme sind ein zentrales Objekt von IT-Sicherheitsforschung, zugleich aber auch Schutzgegenstand
    des Urheberrechts. Dass bestimmte Nutzungen deshalb Rechtsinhabern vorbehalten sind, kann
    IT-Sicherheitsforschung beeinträchtigen. Wo Konflikte zwischen Urheberrecht und IT-Sicherheitsforschung
    auftreten und wie sie unter dem geltenden Recht aufgelöst werden können, ist Gegenstand dieses Beitrags.

- slug: evaluierung-urhwissg
  title: "Die Evaluierung des UrhWissG – Case closed?"
  authors: ["Darius Rostam", "Linda Kuschel"]
  year: 2022
  type: article
  areas: [copyright]
  venue: "RuZ 2022, 162"
  language: de
  openAccess: false
  doi: "10.5771/2699-1284-2022-3-162"
  pdf: "/papers/evaluierung-urhwissg.pdf"
  thumbnail: "/papers/thumbs/evaluierung-urhwissg.png"
  abstract: >-
    Bildung und Forschung stellen an das Urheberrecht besondere Anforderungen. Zum einen entstehen
    wissenschaftliche Werke, die vor allem für Bildung und Forschung relevant sind, häufig nicht allein aus
    ökonomischen Motiven. Wissenschaftler versprechen sich durch Veröffentlichungen Reputationsgewinne und ihre
    Forschung ist in der Regel institutionell finanziert. Die Gefahr einer Unterproduktion von Werken besteht in
    der Wissenschaft deshalb nicht im selben Maße wie in anderen Bereichen – vielmehr spielen ökonomische
    Interessen erst im Rahmen der Distribution eine Rolle. Zum anderen sind Nutzer in Bildung und Wissenschaft auf
    einen Zugang zu Werken besonders angewiesen: Unterricht bedarf einer (nicht notwendigerweise
    vergütungsfreien) Nutzungsmöglichkeit fremder Werke, um vorhandenes Wissen im Interesse gesellschaftlichen
    Fortschritts weiter zu vermitteln. Die Wissenschaft folgt dem Ideal des freien wissenschaftlichen Diskurses,
    der eine schnelle Verfügbarkeit von meist nicht-substituierbaren Erkenntnissen verlangt. Die Interessen von
    Wissenschaftlern als Urheber und als Nutzer fallen deshalb zusammen; Verlage wollen dagegen ihre Kosten im
    Zusammenhang mit der Publikation und Verbreitung amortisieren. Mit dem „Gesetz zur Angleichung des
    Urheberrechts an die aktuellen Erfordernisse der Wissensgesellschaft (Urheberrechts-Wissensgesellschafts-Gesetz
    – UrhWissG)", das am 1. März 2018 in Kraft trat, hat der Gesetzgeber einen neuen Versuch für diesen
    Interessenausgleich unternommen. Das UrhWissG versammelte erstmals Schranken für Bildung, Wissenschaft und
    Institutionen in einem eigenen Unterabschnitt in den §§ 60a–60h UrhG. Es war zunächst auf fünf Jahre befristet
    (§ 142 Abs. 2 UrhG a.F.) und sollte in seinen Auswirkungen nach vier Jahren durch die Bundesregierung evaluiert
    werden (§ 142 Abs. 1 UrhG). Am 4. Mai 2022 hat das Bundeskabinett den Evaluierungsbericht zum UrhWissG
    beschlossen und veröffentlicht. Er stellt dem Gesetz insgesamt ein positives Zeugnis aus. Kann die Akte
    „Urheberrecht für Bildung und Forschung" damit geschlossen werden? Zur Beantwortung dieser Frage geht der
    Beitrag in drei Schritten vor: Zunächst nimmt er kurz die Rechtslage vor Inkrafttreten des UrhWissG in den
    Blick. Anschließend stellt der Beitrag Anspruch und Wirklichkeit des Gesetzes gegenüber. Schließlich zeigt er
    fünf Bereiche auf, in denen der Gesetzgeber die Rechtslage für Bildung und Forschung mit geringem Aufwand
    entscheidend verbessern könnte.

- slug: technikverstaendliches-verhalten
  title: "Das Erfordernis technikverständlichen Verhaltens im Urheberrecht"
  authors: ["Darius Rostam"]
  year: 2021
  type: chapter
  areas: [copyright]
  venue: "in: Kuschel/Asmussen/Golla (Hrsg.), Intelligente Systeme – Intelligentes Recht, Nomos, Baden-Baden 2021"
  language: de
  openAccess: false
  doi: "10.5771/9783748925705-107"
  thumbnail: "/papers/thumbs/technikverstaendliches-verhalten.jpg"
  abstract: >-
    Die Durchsetzung des Urheberrechts wird zunehmend an Mitwirkungsobliegenheiten der Rechtsinhaber geknüpft.
    Dabei verschiebt sich die Handlungslast von den Nutzern hin zu den Rechtsinhabern, die zusätzliche
    Voraussetzungen erfüllen müssen, um ihr üblicherweise unbedingtes Verbotsrecht ausüben zu können. Diese
    Prozeduralisierung reduziert für Nutzer sowohl prohibitive Transaktionskosten als auch das Risiko
    unbeabsichtigter Rechtsverletzungen. Gleichzeitig ermöglicht sie ein stärker differenziertes Urheberrecht,
    indem die Zuordnung von Befugnissen flexibler gestaltet wird. In den Anwendungsfällen können Rechtsinhaber
    ihrer Handlungslast jedoch nur durch technikverständliches Verhalten nachkommen. Dies begrenzt menschliche
    Entscheidungsfreiräume zugunsten maschineller Logik und birgt das Risiko, technische Gegebenheiten
    unreflektiert als normative Vorgaben zu interpretieren. Solche Anforderungen an technikverständliches
    Verhalten sind jedoch legitimiert, wenn Rechtsinhaber die entstehenden Kosten am effizientesten vermeiden
    können und sich freiwillig in bestimmte Verkehrskreise begeben. Ob das Vertrauen dieser Verkehrskreise in die
    Rechtmäßigkeit von Nutzungen schutzwürdig ist, hängt davon ab, wie sehr sie auf das technikverständliche
    Verhalten der Rechtsinhaber angewiesen sind und ob sie darauf vertrauen können, dass Rechtsinhaber die
    Möglichkeit zur Weitergabe kontrollieren. Auf diese Weise kann das Urheberrecht an die Erwartungen seiner
    Umwelt angepasst werden, ohne sich blind normativen Ansprüchen der Technik zu unterwerfen.

- slug: urheberrecht-und-it-sicherheit
  title: "Urheberrecht und IT-Sicherheit"
  authors: ["Darius Rostam", "Linda Kuschel"]
  year: 2021
  type: chapter
  areas: [copyright, it-security-law]
  venue: "in: Ebers/Steinrötter (Hrsg.), Künstliche Intelligenz und smarte Robotik im IT-Sicherheitsrecht, Nomos, Baden-Baden 2021"
  shortVenue: "Ebers/Steinrötter (Hrsg.)"
  language: de
  openAccess: false
  doi: "10.5771/9783748909989-361"
  thumbnail: "/papers/thumbs/urheberrecht-und-it-sicherheit.jpg"
  abstract: >-
    Das Urheberrecht wirkt in mehrfacher Hinsicht auf die IT-Sicherheit ein: Zum einen kann es durch seinen
    Schutzanspruch Innovationen in der Sicherheitstechnologie fördern, sei es direkt oder indirekt. Zum anderen
    unterwirft es Maßnahmen zum Schutz von IT-Systemen, die urheberrechtlich geschützte Inhalte betreffen, der
    Zustimmung der Rechteinhaber. Dieser Beitrag untersucht daher die Bedeutung des Urheberrechts im Kontext des
    IT-Sicherheitsrechts, mit einem besonderen Fokus auf moderne Anwendungsfelder wie Künstliche Intelligenz und
    smarte Robotik. Der Beitrag zeigt auf, dass das Urheberrecht verschiedene Wege bietet, um den Schutz von
    IT-Systemen zu gewährleisten. Obwohl die Zielsetzungen des Urheberrechts und des IT-Sicherheitsrechts oft
    divergieren, ergeben sich positive Effekte etwa aus dem Datenbankherstellerrecht und dem Schutz technischer
    Schutzmaßnahmen. Gleichzeitig kann das Urheberrecht jedoch auch Barrieren für ein höheres IT-Sicherheitsniveau
    schaffen, wenn es die Umsetzung von Sicherheitsmaßnahmen an die Einwilligung des Urhebers knüpft. Das betrifft
    insbesondere den Zugriff auf Software zur Analyse oder die Umgehung technischer Schutzmaßnahmen. Dennoch
    existieren Ansätze, die diese Einschränkungen abfedern können. Zusätzlich trägt das Urheberrecht durch
    gezielte Anreize zur Förderung der IT-Sicherheit bei. Es etabliert Haftungsregeln, die bestimmte
    Verhaltensweisen im Sicherheitsbereich fördern, und es schützt Investitionen in Künstliche Intelligenz, die
    dazu beitragen kann, Sicherheitslücken zu schließen und Angriffe abzuwehren.

