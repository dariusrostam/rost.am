- slug: handlungslasten-des-urhebers
  title: "Handlungslasten des Urhebers"
  authors: ["Darius Rostam"]
  year: 2025
  type: monograph
  areas: [copyright]
  venue: "Mohr Siebeck, Tübingen 2025 (Dissertation, Universität Trier)"
  language: de
  openAccess: true
  doi: "10.1628/978-3-16-164546-4"
  pdf: "/papers/handlungslasten-des-urhebers.pdf"
  thumbnail: "/papers/thumbs/handlungslasten-des-urhebers.png"
  abstract: >-
    Der Normalfall des Urheberrechts ist die Ausschließlichkeit. Grundsätzlich ist die Nutzung von Werken
    verboten, außer der Urheber erlaubt sie. Es liegt deshalb am Nutzer, eine Erlaubnis einzuholen. In jüngerer
    Zeit lassen sich allerdings Tendenzen feststellen, die von diesem Grundsatz abweichen. Nutzungen sind demnach
    erlaubt, außer der Urheber verbietet sie. Urheber tragen folglich die Last, Nutzungen aktiv zu untersagen.
    Darius Rostam untersucht Anwendungsfälle solcher Handlungslasten des Urhebers, legt ihre Grundstruktur offen
    und entwickelt eine kontextneutrale Dogmatik der Rechtsfigur der Handlungslast im Urheberrecht. Unter
    Zuhilfenahme der ökonomischen Analyse des Rechts und Methoden einer soziologischen Jurisprudenz ergibt sich
    ein allgemeiner Maßstab für die Zulässigkeit und Zweckmäßigkeit von Handlungslasten des Urhebers.

- slug: handlungslasten-zge
  title: "Handlungslasten des Urhebers"
  authors: ["Darius Rostam"]
  year: 2025
  type: article
  areas: [copyright, ai]
  venue: "ZGE (4) 2025, 471–499"
  language: de
  openAccess: true
  doi: "10.1628/zge-2025-0022"
  pdf: "/papers/handlungslasten-zge.pdf"
  thumbnail: "/papers/thumbs/handlungslasten-zge.png"
  abstract: >-
    Copyright's paradigm is exclusivity. Generally, a use requires prior permission of the rightsholder – it is up
    to the user to obtain it. Recently, however, there have been tendencies to deviate from this norm. In such
    cases, a use is generally permitted unless the rightsholder prohibits it. Rightsholders therefore bear the
    burden of opting out of otherwise lawful uses. Based on the author's dissertation, this article examines the
    question of when it is reasonable and lawful to impose such burden on rightsholders. German and EU copyright
    law employ 16 use cases of opt-out schemes. The analysis shows that all use cases presuppose that there is a
    transaction cost problem and the objective interests of the parties lean towards allowing such uses without
    individual transactions. The function of an opt-out scheme is then to adapt the exclusive rights to these
    circumstances through a flexible form of entitlement called a loperty rule. Under this rule, the cost of
    establishing a lawful use is reallocated to the rightsholder as the cheapest cost avoider. The article then
    examines the standing of such opt-out schemes under international copyright rules, i.e. the prohibition of
    formalities and the Three-Step test. It shows that most opt-out schemes will not qualify as a formality and
    are also able to ease compliance of limitations and exceptions with the Three-Step test. Finally, the article
    develops a set of criteria to evaluate existing and future opt-out schemes for their reasonableness and
    lawfulness. If applied to the opt-out rules around the training of generative AI models, it becomes apparent
    that opt-out schemes do not meet the necessary conditions to be effective in this context.

- slug: public-rules-of-recognition
  title: "Public Rules of Recognition of Platform Standards"
  authors: ["Darius Rostam"]
  year: 2025
  type: working-paper
  areas: [law-and-society, transnational-law]
  venue: "SSRN Working Paper"
  language: en
  openAccess: true
  ssrn: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5772523"
  pdf: "/papers/public-rules-of-recognition.pdf"
  thumbnail: "/papers/thumbs/public-rules-of-recognition.jpg"
  abstract: >-
    The distinct normative quality of platform standards provides for conflict with the normative claims of
    national legal systems. Now that a first wave of legislation and litigation concerning such standards has
    subsided, the paper investigates how state-based legal systems respond to, recognize or constrain the
    normative orders that platforms built. In a first step, it applies the concept of transnational law to the
    standards set by digital platforms, situating platform governance within a theoretical framework that
    recognizes the global reach and normative force of these standards. In a second step, the paper shifts the
    focus from the platforms' normative orders to the way public legal systems respond to and recognize those
    orders. Drawing on a variety of legislative and judicial responses from the EU and the US it explores the
    abstract criteria under which state-based laws and courts acknowledge platform standards as a form of
    normative ordering. From the analysis, elements of so-called public rules of recognition emerge that indicate
    when platform standards may coexist alongside national legal frameworks as a distinct normative order.

- slug: vervielfaeltigungen-datensatz-zum
  title: "(Nur) Zur Zulässigkeit von Vervielfältigungen für die Erstellung eines Datensatzes"
  authors: ["Darius Rostam", "Linda Kuschel"]
  year: 2025
