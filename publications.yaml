- slug: opt-outs-in-copyright-law
  title: "Opt-Outs in Copyright Law: Can They Save AI Training Under Fair Use and the Three-Step Test?"
  authors: ["Darius Rostam"]
  year: 2026
  type: working-paper
  areas: [copyright, ai]
  venue: "SSRN Working Paper"
  language: en
  openAccess: true
  ssrn: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6163107"
  pdf: "/papers/opt-outs-in-copyright-law.pdf"
  thumbnail: "/papers/thumbs/opt-outs-in-copyright-law.jpg"
  abstract: >-
    The use of copyright-protected works for AI training has thrust opt-out schemes into the center of copyright
    discourse. Unlike conventional copyright rules requiring prior authorization, opt-out schemes permit uses by
    default unless rightholders affirmatively object, effectively reversing copyright's traditional logic of
    exclusivity. This Article provides the first comprehensive analysis of opt-out mechanisms in copyright law.
    Adopting a comparative perspective examining both US and EU copyright frameworks, it traces existing precedents
    ranging from copyright restoration to search engines, mass digitization projects, and online platform
    liability. The Article argues that opt-out schemes serve two principal functions: preserving rightholder
    autonomy through flexible "loperty rules" that combine elements of property and liability rules, and
    controlling user infringement risk by forcing rightholders to disclose information necessary for transactions.
    However, these functions depend on two conditions: rightholders must be aware of both the use and their
    opt-out option, and the opt-out mechanism must be feasible with reasonable effort. Where these conditions are
    met, opt-outs can positively influence the fair use analysis, particularly factors one and four, by supporting
    an inference that a missing opt-out indicates no meaningful threat of substitution. Similarly, under the
    international three-step test, opt-outs help ensure compliance by preventing conflicts with normal
    exploitation and unreasonable prejudice to legitimate interests. Applying this framework to AI training under
    Article 4 DSM Directive and pending US litigation, this Article demonstrates that current opt-out regimes fail
    to meet these conditions. Rightholders often lack awareness, opt-out standards provide insufficient
    granularity, and many works are uploaded by third parties beyond rightholders' control. Consequently, while
    opt-out schemes have legitimate doctrinal foundations, their application to generative AI training is
    currently dysfunctional.

- slug: web-scraping-in-culture-and-law
  title: "Web Scraping in Culture and Law"
  authors: ["Darius Rostam"]
  year: 2026
  type: working-paper
  areas: [culture-and-law, ai]
  venue: "SSRN Working Paper"
  language: en
  openAccess: true
  ssrn: "https://ssrn.com/abstract=6158429"
  pdf: "/papers/web-scraping-in-culture-and-law.pdf"
  thumbnail: "/papers/thumbs/web-scraping-in-culture-and-law.jpg"
  abstract: >-
    This article examines the practice of web scraping through its under-illuminated cultural dimension. It
    situates scraping within internet culture, identifying semiotic markers of both openness and enclosure. Web
    scraping occupies an ambivalent position between these cultures, laden with symbols invoking both trespass and
    free access. The article analyzes how these cultural formations have historically shaped legal outcomes by
    identifying recurring argumentative narratives around privacy and authorization that reflect the cultural
    logics embedded in the law of web scraping. It demonstrates that cultural assumptions that supported a
    permissive legal treatment in the past do not hold for contemporary practices of AI training data collection.
    Yet the law has not itself enforced any particular culture — it merely demands that data hosts who wish to
    prevent scraping coherently signal their intent to enclose, while allowing both cultures to coexist. This
    antihegemonic stance proves increasingly untenable, complicated by the fact that both data hosts as well as AI
    companies operate as hybrids of openness and enclosure. The article advocates instead for explicit legal
    enforcement of either openness or enclosure.

- slug: wieder-nur-vervielfaeltigungen-laion
  title: "(Wieder nur) Zur Zulässigkeit von Vervielfältigungen für die Erstellung eines Datensatzes – zugleich Besprechung von OLG Hamburg, Urt. v. 10.12.2025 – 5 U 104/24 – LAION"
  authors: ["Darius Rostam"]
  year: 2026
  type: case-note
  areas: [copyright, ai]
  venue: "GRUR 2026, 376"
  language: de
  openAccess: false
  url: "https://beck-online.beck.de/Bcid/Y-300-Z-GRUR-B-2026-S-376-N-1"
  thumbnail: "/papers/thumbs/wieder-nur-vervielfaeltigungen-laion.jpg"
  abstract: >-
    Die erstinstanzliche Entscheidung des LG Hamburg in der Sache „LAION" ist auf ein großes Echo gestoßen. Das
    OLG Hamburg hat nun die Berufung des Klägers zurückgewiesen, gleichzeitig sein Urteil aber auf eine andere,
    tragfähigere Begründung gestützt. So arbeitet es bei der Erklärungsbefugnis für den Text und Data Mining
    (TDM)-Vorbehalt und den Anforderungen an die Maschinenlesbarkeit in § 44b Abs. 3 UrhG differenziertere Maßstäbe
    heraus und trennt bei § 60d UrhG klarer zwischen sachlichem und persönlichem Anwendungsbereich. Besondere
    Aufmerksamkeit verdienen die eingehende Prüfung des Drei-Stufen-Tests sowie die Frage, inwieweit Fernwirkungen
    auf nachgelagerten Gliedern der KI-Wertschöpfungskette bei der Beurteilung der konkreten
    Vervielfältigungshandlung zu berücksichtigen sind.

- slug: zum-umgang-mit-umgehung
  title: "Zum Umgang mit Umgehung – Anmerkung zu Generalanwalt beim EuGH, Schlussanträge vom 15.1.2026 – C-788/24 – Anne Frank Fonds"
  authors: ["Darius Rostam"]
  year: 2026
  type: case-note
  areas: [copyright]
  venue: "ZUM 2026, 535"
  language: de
  openAccess: false
  url: "https://beck-online.beck.de/Bcid/Y-300-Z-ZUM-B-2026-S-535-N-1"
  pdf: "/papers/zum-umgang-mit-umgehung.pdf"
  thumbnail: "/papers/thumbs/zum-umgang-mit-umgehung.jpg"
  abstract: >-
    Generalanwalt Rantos hat in der Rechtssache Anne Frank Fonds (C-788/24) Schlussanträge dazu vorgelegt, wie die
    öffentliche Wiedergabe im Internet zu lokalisieren ist. Er verneint zwar ein Ausrichtungserfordernis als
    Tatbestandsvoraussetzung, nimmt aber wirksames Geoblocking vom Tatbestand aus; die bloße Möglichkeit einer
    Umgehung durch VPN-Dienste soll daran nichts ändern. Der Beitrag zeigt, dass diese Lösung faktisch zu einer
    Geoblocking-Pflicht für jede Veröffentlichung im Internet führt und der EuGH stattdessen das im Markenrecht, im
    Datenbankherstellerrecht und für das Recht der öffentlichen Wiedergabe aus der Vermiet- und Verleih-Richtlinie
    bereits etablierte Ausrichtungskriterium heranziehen sollte; Zustimmung verdienen die Schlussanträge dagegen,
    soweit sie die bloße Umgehungsmöglichkeit für die Annahme einer Wiedergabehandlung im gesperrten Gebiet nicht
    ausreichen lassen.

- slug: targeting-the-right-question
  title: "Targeting the Right Question: What AG Rantos Left Open in Anne Frank Fonds"
  authors: ["Darius Rostam"]
  year: 2026
  type: blog
  areas: [copyright]
  venue: "Kluwer Copyright Blog"
  language: en
  openAccess: true
  url: "https://legalblogs.wolterskluwer.com/copyright-blog/targeting-the-right-question-what-ag-rantos-left-open-in-anne-frank-fonds/"
  thumbnail: "/papers/thumbs/targeting-the-right-question.jpg"
  abstract: >-
    This piece analyzes AG Rantos's Opinion in Anne Frank Fonds (C-788/24), on how to localize communication to the
    public online when a work is protected in one EU state but not in another. While welcoming the Opinion's
    conclusion that effective geoblocking keeps a publication outside Article 3(1) InfoSoc Directive, and that mere
    VPN circumvention doesn't change that, the piece argues that AG Rantos should not have sidestepped the Dutch
    Supreme Court's central question: whether communication to the public requires the content to be "targeted" at
    a state's audience — a test the CJEU already applies in trademark law, the database right, and the
    distribution right. A targeting test would better balance rightholder and user interests than the proposed
    accessibility-plus-geoblocking-exception model, particularly for libraries, archives, and museums that often
    don't know a work remains protected elsewhere.

